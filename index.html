  <script>
    // Applies the stored theme/language before first paint so dark mode does
    // not flash light on load. ThemeContext takes over once React mounts.
    (function () {
      try {
        var t = localStorage.getItem('medtime-theme');
        if (t !== 'emerald' && t !== 'forest') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'forest' : 'emerald';
        }
        document.documentElement.setAttribute('data-theme', t);
        var l = localStorage.getItem('medtime-lang');
        if (l) document.documentElement.setAttribute('lang', l);
      } catch (e) { /* private mode: fall back to the markup defaults */ }
    })();
  </script>

        }
      },
      {
        "@type": "Question",

        }
      },
      {
        "@type": "Question",
        "name": "Ma'lumotlarimni o'chira olamanmi?",

          "@type": "Answer",

        }
      },
